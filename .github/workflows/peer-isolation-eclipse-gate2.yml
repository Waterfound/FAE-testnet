name: peer-isolation-eclipse-gate2

on:
  push:
    branches: [lab-peer-isolation-eclipse-gate2]
  pull_request:
    paths:
      - 'sovereign-forge/node/lab/peer-isolation-*.mjs'
      - 'sovereign-forge/node/authoritative/fae-v4-peer-node.mjs'
      - 'sovereign-forge/node/authoritative/peer-*.mjs'
      - 'sovereign-forge/tests/peer-isolation-eclipse-*.mjs'
      - 'sovereign-forge/protocol/PEER_ISOLATION_ECLIPSE_*.md'
      - '.github/workflows/peer-isolation-eclipse-gate2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-isolation-eclipse-gate2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol6-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check Gate 2 composition and topology
        run: |
          node --check sovereign-forge/node/lab/peer-isolation-protocol6-candidate.mjs
          node --check sovereign-forge/tests/peer-isolation-eclipse-protocol6.mjs

      - name: Re-run Gate 1 starvation resistance
        run: node --test sovereign-forge/tests/peer-isolation-eclipse-resistance.mjs

      - name: Re-run authoritative protocol-6 integration baseline
        run: node --test sovereign-forge/tests/authoritative-p2p-v6-integration.mjs

      - name: Run real protocol-6 peer isolation and recovery topology
        run: node --test sovereign-forge/tests/peer-isolation-eclipse-protocol6.mjs
