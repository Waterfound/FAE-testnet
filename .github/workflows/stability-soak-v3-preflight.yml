name: stability-soak-v3-preflight

on:
  pull_request:
    paths:
      - 'sovereign-forge/tests/stability-soak-v3-preflight.mjs'
      - 'sovereign-forge/tests/stability-soak-v3-preflight.test.mjs'
      - 'sovereign-forge/release/stability-soak-v3-preflight.json'
      - 'sovereign-forge/evidence/STABILITY_SOAK_V3_RENDER_FREE_PREFLIGHT.json'
      - '.github/workflows/stability-soak-v3-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check sovereign-forge/tests/stability-soak-v3-preflight.mjs
          node --check sovereign-forge/tests/stability-soak-v3-preflight.test.mjs
      - name: Verify fail-closed preflight behavior
        run: node --test sovereign-forge/tests/stability-soak-v3-preflight.test.mjs
      - name: Confirm prepared manifest cannot accidentally start V3
        run: |
          node sovereign-forge/tests/stability-soak-v3-preflight.mjs sovereign-forge/release/stability-soak-v3-preflight.json && exit 1 || test $? -eq 2
      - name: Confirm observed Render Free topology fails V3 preflight
        run: |
          node sovereign-forge/tests/stability-soak-v3-preflight.mjs sovereign-forge/evidence/STABILITY_SOAK_V3_RENDER_FREE_PREFLIGHT.json && exit 1 || test $? -eq 2
