name: pq-lab-wave-e-pq06

on:
  pull_request:
    paths:
      - 'lab/post-quantum-signatures/wave-e/pq06/**'
      - '.github/workflows/pq-lab-wave-e-pq06.yml'
  push:
    branches:
      - 'colony/pq06-*'
    paths:
      - 'lab/post-quantum-signatures/wave-e/pq06/**'
      - '.github/workflows/pq-lab-wave-e-pq06.yml'

permissions:
  contents: read

jobs:
  pq06-wallet-migration-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'
      - name: PQ-00 boundary guard
        env:
          PQ_BOUNDARY_BASE: ${{ github.event.pull_request.base.sha }}
          PQ_BOUNDARY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PQ_BOUNDARY_BASE" ] && [ -n "$PQ_BOUNDARY_HEAD" ]; then
            node lab/post-quantum-signatures/boundary-guard.mjs --base "$PQ_BOUNDARY_BASE" --head "$PQ_BOUNDARY_HEAD"
          else
            node lab/post-quantum-signatures/boundary-guard.mjs
          fi
      - name: Enforce executor binding
        id: binding
        shell: bash
        run: |
          if [ -f "lab/post-quantum-signatures/wave-e/pq06/test.mjs" ]; then
            echo "bound=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_HEAD_REF" = "colony/pq-wave-e-harness" ]; then
            echo "bound=false" >> "$GITHUB_OUTPUT"
            echo "Harness bootstrap: implementation intentionally absent."
            exit 0
          fi
          echo "Missing required Wave E test: lab/post-quantum-signatures/wave-e/pq06/test.mjs" >&2
          exit 1
      - name: Verify PQ-03 prerequisite
        run: node -e "const s=require('./lab/post-quantum-signatures/gate-status.json'); if(s.gates['PQ-03']?.status!=='GREEN'||s.activation_authorized!==false)process.exit(1)"
      - name: Install pinned PQ dependencies
        if: steps.binding.outputs.bound == 'true'
        working-directory: lab/post-quantum-signatures
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute PQ-06 frozen recovery matrix
        if: steps.binding.outputs.bound == 'true'
        run: |
          set -o pipefail
          mkdir -p lab/post-quantum-signatures/evidence/wave-e
          node lab/post-quantum-signatures/wave-e/pq06/test.mjs | tee lab/post-quantum-signatures/evidence/wave-e/pq06.json
      - name: Upload PQ-06 evidence
        if: always() && steps.binding.outputs.bound == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pq06-wallet-migration-shadow
          path: lab/post-quantum-signatures/evidence/wave-e/pq06.json
          if-no-files-found: error
