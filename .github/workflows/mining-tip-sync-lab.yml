name: mining-tip-sync-lab

on:
  push:
    branches:
      - 'colony/mts-*'
    paths:
      - 'lab/mining-tip-sync/**'
      - 'docs/FAE_MINING_TIP_SYNC_*'
      - '.github/workflows/mining-tip-sync-lab.yml'
  pull_request:
    paths:
      - 'lab/mining-tip-sync/**'
      - 'docs/FAE_MINING_TIP_SYNC_*'
      - '.github/workflows/mining-tip-sync-lab.yml'

permissions:
  contents: read

jobs:
  mts-00-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check active reference files
        run: |
          node --check core.js
          node --check mining.js

      - name: MTS-00 boundary guard
        run: node lab/mining-tip-sync/boundary-guard.mjs --base origin/main

      - name: Verify frozen MTS-01 baseline evidence
        run: node -e "const e=require('./lab/mining-tip-sync/evidence/mts-01-baseline.json'); if(e.status!=='GREEN') process.exit(1);"

      - name: MTS-02/03 identity and tip-observer contract tests
        run: node --test lab/mining-tip-sync/tests/mts-02-03.test.mjs

      - name: Verify canonical browser miner mirror and integrity manifest
        run: |
          cmp mining.js sovereign-forge/browser/mining.js
          sha256sum mining.js
          sha256sum -c FAE_FORGE_MAIN.sha256

      - name: MTS-04/05/06 stale-work, race and freshness regression tests
        run: node --test lab/mining-tip-sync/tests/mts-04-06.test.mjs

      - name: MTS-07 rapid-tip CPU-delay and network-failure stress
        run: node --test lab/mining-tip-sync/tests/mts-07-stress.test.mjs

      - name: MTS-08 background throttling suspend-return lifecycle stress
        run: node --test lab/mining-tip-sync/tests/mts-08-lifecycle.test.mjs
