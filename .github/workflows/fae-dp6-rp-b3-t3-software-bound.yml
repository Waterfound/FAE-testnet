name: fae-dp6-rp-b3-t3-software-bound
on:
  pull_request:
    paths:
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-memory-economics-falsifier.mjs'
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-memory-economics-falsifier.test.mjs'
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-external-evidence-intake.mjs'
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-external-evidence-intake.test.mjs'
      - '.github/workflows/fae-dp6-rp-b3-t3-software-bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-owned HBM/GDDR conditional specialist bounds and fail-closed economics
        run: node --test labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-memory-economics-falsifier.test.mjs
      - name: Reject unbound or self-attested specialist economic evidence
        run: node --test labs/asic-f2-pre-go/reviews/rp-b3-t2/dp6-external-evidence-intake.test.mjs
