name: FAE Block Explorer Lab

on:
  push:
    branches:
      - "lab/block-explorer-*"
    paths:
      - "lab/block-explorer/**"
      - "explorer/**"
      - ".github/workflows/block-explorer-lab.yml"
  pull_request:
    paths:
      - "lab/block-explorer/**"
      - "explorer/**"
      - ".github/workflows/block-explorer-lab.yml"

permissions:
  contents: read

jobs:
  be01-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Boundary guard
        run: node lab/block-explorer/boundary-guard.mjs
      - name: BE-01 contract tests
        run: node --test lab/block-explorer/tests/be-01-contract.test.mjs
      - name: BE-02 query-surface tests
        run: node --test lab/block-explorer/tests/be-02-query-surface.test.mjs
      - name: BE-03 application tests
        run: node --test lab/block-explorer/tests/be-03-app.test.mjs
      - name: BE-04 deployment-boundary tests
        run: node --test lab/block-explorer/tests/be-04-deployment.test.mjs
      - name: BE-05 discovery/deployment contract tests
        run: node --test lab/block-explorer/tests/be-05-contract.test.mjs
      - name: BE-05 public gateway tests
        run: node --test lab/block-explorer/tests/be-05-readonly-gateway.test.mjs
      - name: BE-05 HTTPS binding probe tests
        run: node --test lab/block-explorer/tests/be-05-binding-probe.test.mjs
      - name: Check Explorer application syntax
        run: |
          node --check explorer/api-client.mjs
          node --check explorer/app.mjs
          node --check explorer/build.mjs
          node --check lab/block-explorer/be05-readonly-gateway.mjs
          node --check lab/block-explorer/be05-binding-probe.mjs
      - name: Check Independent Node syntax
        run: |
          node --check sovereign-forge/node/explorer-read.mjs
          node --check sovereign-forge/node/fae-node.mjs
      - name: Report BE-02 integrity hashes
        run: |
          sha256sum sovereign-forge/node/fae-node.mjs
          sha256sum sovereign-forge/node/README.md
          sha256sum sovereign-forge/node/explorer-read.mjs
