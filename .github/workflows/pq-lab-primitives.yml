name: pq-lab-primitives

on:
  pull_request:
    paths:
      - 'lab/post-quantum-signatures/**'
      - '.github/workflows/pq-lab-primitives.yml'

permissions:
  contents: read

jobs:
  primitive-correctness:
    runs-on: ubuntu-latest
    env:
      PQ_ACVP_DIR: ${{ runner.temp }}/fae-pq-acvp
      CIRCL_DIR: ${{ runner.temp }}/circl
      PQ_EVIDENCE_DIR: lab/post-quantum-signatures/evidence/wave-d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: PQ-00 boundary guard on current PR delta
        env:
          PQ_BOUNDARY_BASE: ${{ github.event.pull_request.base.sha }}
          PQ_BOUNDARY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node lab/post-quantum-signatures/boundary-guard.mjs --base "$PQ_BOUNDARY_BASE" --head "$PQ_BOUNDARY_HEAD"

      - name: Prepare evidence directory
        run: mkdir -p "$PQ_EVIDENCE_DIR"

      - name: Install exact Noble candidate
        working-directory: lab/post-quantum-signatures
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Checkout exact CIRCL verifier
        run: |
          set -euo pipefail
          git init "$CIRCL_DIR"
          git -C "$CIRCL_DIR" remote add origin https://github.com/cloudflare/circl.git
          git -C "$CIRCL_DIR" fetch --depth 1 origin 2ef8bf457d28ab1c62f42b76f6564610c5a3b3f0
          git -C "$CIRCL_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$CIRCL_DIR" rev-parse HEAD)" = "2ef8bf457d28ab1c62f42b76f6564610c5a3b3f0"

      - name: Reacquire and verify frozen NIST ACVP corpus
        run: |
          set -o pipefail
          node lab/post-quantum-signatures/primitives/prepare-acvp.mjs | tee "$PQ_EVIDENCE_DIR/acvp-acquisition.log"
          cp "$PQ_ACVP_DIR/acquisition-evidence.json" "$PQ_EVIDENCE_DIR/acvp-acquisition.json"

      - name: PQ-03 and PQ-04 Noble official-vector replay
        run: |
          set -o pipefail
          node lab/post-quantum-signatures/primitives/run-noble-acvp.mjs | tee "$PQ_EVIDENCE_DIR/noble-acvp.json"

      - name: PQ-03 CIRCL full ML-DSA ACVP replay
        working-directory: ${{ runner.temp }}/circl
        run: |
          set -o pipefail
          go test ./sign/mldsa/mldsa44 ./sign/mldsa/mldsa65 ./sign/mldsa/mldsa87 -run TestACVP -count=1 -v | tee "$GITHUB_WORKSPACE/$PQ_EVIDENCE_DIR/circl-mldsa-acvp.log"

      - name: PQ-04 CIRCL native SLH-DSA ACVP replay
        working-directory: ${{ runner.temp }}/circl
        run: |
          set -o pipefail
          go test ./sign/slhdsa -run TestACVP -count=1 -v | tee "$GITHUB_WORKSPACE/$PQ_EVIDENCE_DIR/circl-slhdsa-acvp.log"

      - name: Noble produces cross-implementation corpus
        run: |
          node lab/post-quantum-signatures/primitives/cross-generate-noble.mjs "$PQ_EVIDENCE_DIR/noble-to-circl.json"

      - name: CIRCL verifies Noble and produces reverse corpus
        run: |
          set -euo pipefail
          mkdir -p "$CIRCL_DIR/cmd/fae-pq-cross"
          cp lab/post-quantum-signatures/primitives/cross-circl.go "$CIRCL_DIR/cmd/fae-pq-cross/main.go"
          (
            cd "$CIRCL_DIR"
            go run ./cmd/fae-pq-cross "$GITHUB_WORKSPACE/$PQ_EVIDENCE_DIR/noble-to-circl.json" "$GITHUB_WORKSPACE/$PQ_EVIDENCE_DIR/circl-to-noble.json"
          ) | tee "$PQ_EVIDENCE_DIR/cross-circl.log"

      - name: Noble verifies CIRCL reverse corpus
        run: |
          set -o pipefail
          node lab/post-quantum-signatures/primitives/cross-verify-noble.mjs "$PQ_EVIDENCE_DIR/circl-to-noble.json" | tee "$PQ_EVIDENCE_DIR/cross-final.json"

      - name: Record executor provenance
        if: always()
        run: |
          {
            echo "{"
            echo "  \"node\": \"$(node --version)\","
            echo "  \"go\": \"$(go version)\","
            echo "  \"circl_commit\": \"$(git -C "$CIRCL_DIR" rev-parse HEAD 2>/dev/null || echo unavailable)\","
            echo "  \"fae_head\": \"$GITHUB_SHA\""
            echo "}"
          } > "$PQ_EVIDENCE_DIR/executor-provenance.json"

      - name: Upload Wave D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pq03-pq04-primitive-correctness
          path: lab/post-quantum-signatures/evidence/wave-d
          if-no-files-found: error
