name: verify-canonical-source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report protected-source SHA-256
        run: |
          sha256sum sovereign-forge/node/fae-node.mjs
          sha256sum sovereign-forge/browser/mining.js

      - name: Verify imported Sovereign Forge snapshot
        run: sha256sum -c FAE_FORGE_MAIN.sha256

      - name: Verify exported Supabase source
        run: cd supabase && sha256sum -c SOURCE_MANIFEST.sha256

      - name: Check browser, P2P v6, coordinator and candidate Edge source syntax
        run: |
          node --check core.js
          node --check wallet-crypto.js
          node --check wallet.js
          node --check mining.js
          node --check network-status.js
          node --check sovereign-forge/node/fae-node-v6-candidate.mjs
          node --check sovereign-forge/node/fae-share-coordinator-v1-candidate.mjs
          node --check sovereign-forge/node/authoritative/fae-v4-peer-node.mjs
          node --check sovereign-forge/node/authoritative/peer-diversity.mjs
          node --check sovereign-forge/node/authoritative/peer-directory.mjs
          node --check sovereign-forge/node/authoritative/pplns-http-adapter.mjs
          node --check sovereign-forge/supabase/functions/fae-public-testnet-v4-authoritative-candidate/index.ts
          node --check sovereign-forge/supabase/functions/fae-chain-feed-v2-authoritative-candidate/index.ts
          node --check sovereign-forge/deploy/coordinator-dedicated/canary.mjs

      - name: Verify dedicated coordinator deployment manifest
        env:
          FAE_COORDINATOR_DOMAIN: coordinator.test.invalid
          FAE_CANDIDATE_API_URL: https://wfwwotuhectwknvbvgif.supabase.co/functions/v1/fae-public-testnet-v4-authoritative-candidate
        run: |
          docker compose -f sovereign-forge/deploy/coordinator-dedicated/compose.yaml config > /tmp/fae-coordinator-compose.yml
          grep -q 'fae-public-testnet-v4-authoritative-candidate' /tmp/fae-coordinator-compose.yml
          grep -q 'coordinator-data' /tmp/fae-coordinator-compose.yml
          grep -q '/data' /tmp/fae-coordinator-compose.yml
          if grep -Eq 'published:[[:space:]]*"?3190"?' /tmp/fae-coordinator-compose.yml; then
            echo 'Coordinator port 3190 must not be published on the host' >&2
            exit 1
          fi

      - name: Verify browser wallet, client and coordinator fallback flows
        run: |
          node tests/crypto-compat.mjs
          node tests/client-smoke.mjs
          node tests/mining-coordinator-smoke.mjs

      - name: Verify deployed miner matches Forge snapshot
        run: cmp mining.js sovereign-forge/browser/mining.js

      - name: Install locked reference-node package
        run: npm ci --prefix sovereign-forge/node

      - name: Check independent reference node
        run: npm run --prefix sovereign-forge/node check

      - name: Mine and validate isolated smoke block
        run: node sovereign-forge/tests/smoke-independent-node.mjs

      - name: Verify historical bootstrap boundary
        run: node sovereign-forge/tests/sync-legacy-bootstrap.mjs

      - name: Verify three-node partition recovery
        run: node sovereign-forge/tests/partition-recovery-3node.mjs

      - name: Verify Authoritative P2P security primitives
        run: node --test sovereign-forge/tests/authoritative-p2p-security.mjs

      - name: Verify Authoritative coordinator signer and codec
        run: node --test sovereign-forge/tests/authoritative-coordinator-signer-codec.mjs

      - name: Verify Authoritative PPLNS HTTP candidate adapter
        run: node --test sovereign-forge/tests/authoritative-pplns-http-adapter.mjs

      - name: Verify executable Authoritative coordinator runtime
        run: node --test sovereign-forge/tests/authoritative-coordinator-runtime.mjs

      - name: Verify reconciled v4 consensus core and activation boundary
        run: node --test sovereign-forge/tests/authoritative-v4-core.mjs

      - name: Verify Authoritative protocol 6 headers-first integration
        run: node --test sovereign-forge/tests/authoritative-p2p-v6-integration.mjs

      - name: Verify peer diversity and deterministic eclipse simulations
        run: node --test sovereign-forge/tests/authoritative-peer-diversity.mjs

      - name: Verify executable P2P v6 candidate entrypoint
        run: node --test sovereign-forge/tests/authoritative-v6-entrypoint.mjs

      - name: Build deployable P2P v6 candidate image
        run: docker build -f sovereign-forge/node/Dockerfile.v6-candidate sovereign-forge/node

      - name: Build deployable share-coordinator candidate image
        run: docker build -f sovereign-forge/node/Dockerfile.coordinator-candidate sovereign-forge/node

      - name: Verify candidate PPLNS coinbase migration on PostgreSQL 16
        run: bash sovereign-forge/tests/verify-pplns-sql-migration.sh
