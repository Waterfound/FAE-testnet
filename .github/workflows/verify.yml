name: verify-canonical-source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report reference-node SHA-256
        run: sha256sum sovereign-forge/node/fae-node.mjs

      - name: Verify imported Sovereign Forge snapshot
        run: sha256sum -c FAE_FORGE_MAIN.sha256

      - name: Verify exported Supabase source
        run: cd supabase && sha256sum -c SOURCE_MANIFEST.sha256

      - name: Check browser source syntax
        run: |
          node --check core.js
          node --check wallet-crypto.js
          node --check wallet.js
          node --check mining.js
          node --check network-status.js

      - name: Verify browser wallet and client flows
        run: |
          node tests/crypto-compat.mjs
          node tests/client-smoke.mjs

      - name: Verify deployed miner matches Forge snapshot
        run: cmp mining.js sovereign-forge/browser/mining.js

      - name: Install locked reference-node package
        run: npm ci --prefix sovereign-forge/node

      - name: Check independent reference node
        run: npm run --prefix sovereign-forge/node check

      - name: Mine and validate isolated smoke block
        run: node sovereign-forge/tests/smoke-independent-node.mjs

      - name: Verify historical bootstrap boundary
        run: node sovereign-forge/tests/sync-legacy-bootstrap.mjs

      - name: Verify three-node partition recovery
        run: node sovereign-forge/tests/partition-recovery-3node.mjs

      - name: Verify Authoritative P2P security primitives
        run: node --test sovereign-forge/tests/authoritative-p2p-security.mjs

      - name: Verify Authoritative coordinator signer and codec
        run: node --test sovereign-forge/tests/authoritative-coordinator-signer-codec.mjs

      - name: Verify reconciled v4 consensus core and activation boundary
        run: node --test sovereign-forge/tests/authoritative-v4-core.mjs

      - name: Verify Authoritative protocol 6 headers-first integration
        run: node --test sovereign-forge/tests/authoritative-p2p-v6-integration.mjs

      - name: Verify peer diversity and deterministic eclipse simulations
        run: node --test sovereign-forge/tests/authoritative-peer-diversity.mjs
