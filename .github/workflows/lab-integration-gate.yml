name: cross-lab-integration-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-cross-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require candidate to contain latest canonical main
        run: node tools/verify-lab-integration.mjs --require-latest-main

      - name: Run cross-Lab combined verification
        run: node tools/verify-lab-integration.mjs --run

      - name: Re-run canonical browser source mirror check
        run: cmp mining.js sovereign-forge/browser/mining.js
