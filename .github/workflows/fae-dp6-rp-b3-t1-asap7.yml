name: FAE DP6 RP-B3-T1 ASAP7 PPA

on:
  push:
    branches:
      - evidence/fae-dp6-rp-b3-t1-20260929
    paths:
      - '.github/workflows/fae-dp6-rp-b3-t1-asap7.yml'
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t1/execution/LAUNCH.json'
      - 'labs/asic-f2-pre-go/reviews/rp-b3-t1/execution/run_asap7_ppa.sh'

permissions:
  contents: write

concurrency:
  group: fae-dp6-rp-b3-t1-asap7
  cancel-in-progress: false

jobs:
  ppa:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Execute parity-bound ASAP7 research PPA
        run: |
          chmod +x labs/asic-f2-pre-go/reviews/rp-b3-t1/execution/run_asap7_ppa.sh
          labs/asic-f2-pre-go/reviews/rp-b3-t1/execution/run_asap7_ppa.sh

      - name: Upload RP-B3-T1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fae-dp6-rp-b3-t1-asap7-evidence
          path: labs/asic-f2-pre-go/reviews/rp-b3-t1/results
          if-no-files-found: warn
          retention-days: 30

      - name: Persist compact evidence to branch
        if: always()
        run: |
          if [ ! -d labs/asic-f2-pre-go/reviews/rp-b3-t1/results ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/asic-f2-pre-go/reviews/rp-b3-t1/results
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "RP-B3-T1: persist ASAP7 execution evidence [skip ci]"
          git pull --rebase origin evidence/fae-dp6-rp-b3-t1-20260929
          git push origin HEAD:evidence/fae-dp6-rp-b3-t1-20260929
