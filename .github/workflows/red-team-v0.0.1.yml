name: red-team-v0.0.1

on:
  push:
    paths:
      - 'red-team/**'
      - '.github/workflows/red-team-v0.0.1.yml'
  pull_request:
    paths:
      - 'red-team/**'
      - '.github/workflows/red-team-v0.0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-red-team-v0.0.1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify engine contracts and meta-red-team
        run: npm --prefix red-team run verify

      - name: Run frozen cross-domain FAE smoke twice
        run: npm --prefix red-team run campaign:smoke
