name: Representative Device Physical Autopilot

on:
  push:
    branches:
      - "colony/fae-representative-device-physical-autopilot-*"
  pull_request:
    paths:
      - "lab/representative-device-physical-autopilot/**"
      - "docs/FAE_REPRESENTATIVE_DEVICE_PHYSICAL_AUTOPILOT_*"
      - ".github/workflows/representative-device-physical-autopilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rde-physical-autopilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax and shell checks
        run: |
          node --check lab/representative-device-physical-autopilot/autopilot-core.mjs
          node --check lab/representative-device-physical-autopilot/autopilot-browser.mjs
          node --check lab/representative-device-physical-autopilot/desktop-agent.mjs
          node --check lab/representative-device-physical-autopilot/import-browser-portfolio.mjs
          node --check lab/representative-device-physical-autopilot/tests/autopilot.test.mjs
          sh -n lab/representative-device-physical-autopilot/run-autopilot.sh

      - name: Parse Build Colony and protocol state
        run: |
          node -e "JSON.parse(require('fs').readFileSync('lab/representative-device-physical-autopilot/protocol.json'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/FAE_REPRESENTATIVE_DEVICE_PHYSICAL_AUTOPILOT_BUILD_COLONY_RUN.json'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/FAE_REPRESENTATIVE_DEVICE_PHYSICAL_AUTOPILOT_DURABLE_STATE.json'))"

      - name: Run Physical Autopilot adversarial contract tests
        run: node --test lab/representative-device-physical-autopilot/tests/autopilot.test.mjs

      - name: Preserve parent RDE verifier and canonical readiness invariants
        run: |
          node --test lab/representative-device-evidence-readiness/tests/rde-readiness.test.mjs
          node tools/verify-mainnet-readiness-state.mjs
