name: authored-element-product-gates
on:
  pull_request:
    paths:
      - 'docs/product/FAE_ELEMENT_PRODUCT_GATE_BRIDGE.json'
      - 'docs/product/FAE_ELEMENT_PRODUCT_GATE_BRIDGE.md'
      - 'product-data/verify-element-product-bridge.mjs'
      - 'tests/element-product-gates.test.mjs'
      - '.github/workflows/authored-element-product-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authored product gate matrix and adversarial invariants
        run: node --test tests/element-product-gates.test.mjs
