name: iPad Unified Physical Pretest (MI / HFB / RDE / MTS)
on:
  pull_request:
    paths:
      - "lab/ipad-unified-physical-pretest/**"
      - ".github/workflows/ipad-unified-physical-pretest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bound all physical-test inputs and preserve reality gap
        run: node lab/ipad-unified-physical-pretest/verify-pretest.mjs
      - name: Re-run existing RDE physical-autopilot contract suite
        run: node --test lab/representative-device-physical-autopilot/tests/autopilot.test.mjs
      - name: Re-run existing RDE independent evidence verifier tests
        run: node --test lab/representative-device-evidence-readiness/tests/rde-readiness.test.mjs
      - name: Assert canonical mainnet state untouched
        run: node tools/verify-mainnet-readiness-state.mjs
