name: pq-lab-wave-e-pq05

on:
  pull_request:
    paths:
      - 'lab/post-quantum-signatures/wave-e/pq05/**'
      - '.github/workflows/pq-lab-wave-e-pq05.yml'
  push:
    branches:
      - 'colony/pq05-*'
    paths:
      - 'lab/post-quantum-signatures/wave-e/pq05/**'
      - '.github/workflows/pq-lab-wave-e-pq05.yml'

permissions:
  contents: read

jobs:
  pq05-hybrid-transaction-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.8.0'
      - name: PQ-00 boundary guard
        env:
          PQ_BOUNDARY_BASE: ${{ github.event.pull_request.base.sha }}
          PQ_BOUNDARY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PQ_BOUNDARY_BASE" ] && [ -n "$PQ_BOUNDARY_HEAD" ]; then
            node lab/post-quantum-signatures/boundary-guard.mjs --base "$PQ_BOUNDARY_BASE" --head "$PQ_BOUNDARY_HEAD"
          else
            node lab/post-quantum-signatures/boundary-guard.mjs
          fi
      - name: Verify PQ-03 prerequisite
        run: node -e "const s=require('./lab/post-quantum-signatures/gate-status.json'); if(s.gates['PQ-03']?.status!=='GREEN'||s.activation_authorized!==false)process.exit(1)"
      - name: Install pinned PQ dependencies
        working-directory: lab/post-quantum-signatures
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Execute PQ-05 frozen shadow matrix
        run: |
          set -o pipefail
          mkdir -p lab/post-quantum-signatures/evidence/wave-e
          node lab/post-quantum-signatures/wave-e/pq05/test.mjs | tee lab/post-quantum-signatures/evidence/wave-e/pq05.json
      - name: Upload PQ-05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pq05-hybrid-transaction-shadow
          path: lab/post-quantum-signatures/evidence/wave-e/pq05.json
          if-no-files-found: error
