name: FAE 180s Economic + Block-Time Validation

on:
  push:
    branches:
      - colony/fae-180s-economic-block-time-validation-001
    paths:
      - "sovereign-forge/node/lab/economic-block-time-180-daa-validation.mjs"
      - "sovereign-forge/tests/economic-block-time-180-daa-validation.mjs"
      - ".github/workflows/fae-180s-economic-block-time-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-v4-daa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact source
        run: |
          git rev-parse HEAD
          test "$(git branch --show-current)" = "colony/fae-180s-economic-block-time-validation-001"
      - name: Run focused tests
        run: node --test sovereign-forge/tests/economic-block-time-180-daa-validation.mjs
      - name: Execute frozen 256-seed study
        run: |
          node sovereign-forge/node/lab/economic-block-time-180-daa-validation.mjs 256 > /tmp/fae-180s-daa-study.json
          node -e "const r=require('/tmp/fae-180s-daa-study.json'); if(r.activationAuthorized!==false||r.selectionAuthorized!==false) process.exit(1); console.log(JSON.stringify({schema:r.schema,seeds:r.methodology.seeds,constants:r.active_constants},null,2));"
      - uses: actions/upload-artifact@v4
        with:
          name: fae-180s-daa-study-${{ github.sha }}
          path: /tmp/fae-180s-daa-study.json
          if-no-files-found: error
          retention-days: 30
