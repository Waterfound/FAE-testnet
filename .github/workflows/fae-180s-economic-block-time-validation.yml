name: FAE 180s Economic + Block-Time Validation

on:
  push:
    branches:
      - colony/fae-180s-economic-block-time-validation-001
    paths:
      - "sovereign-forge/node/lab/economic-block-time-180-daa-validation.mjs"
      - "sovereign-forge/node/lab/economic-block-time-180-timestamp-daa-coupling.mjs"
      - "sovereign-forge/node/lab/economic-block-time-180-mining-economics.mjs"
      - "sovereign-forge/node/lab/economic-block-time-180-decentralization.mjs"
      - "sovereign-forge/node/lab/economic-block-time-180-outage-recovery.mjs"
      - "sovereign-forge/tests/economic-block-time-180-daa-validation.mjs"
      - "sovereign-forge/tests/economic-block-time-180-timestamp-daa-coupling.mjs"
      - "sovereign-forge/tests/economic-block-time-180-economics-decentralization-recovery.mjs"
      - ".github/workflows/fae-180s-economic-block-time-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-v4-daa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact source
        run: |
          git rev-parse HEAD
          test "$(git branch --show-current)" = "colony/fae-180s-economic-block-time-validation-001"
      - name: Run focused tests
        run: |
          node --test sovereign-forge/tests/economic-block-time-180-daa-validation.mjs
          node --test sovereign-forge/tests/economic-block-time-180-timestamp-daa-coupling.mjs
          node --test sovereign-forge/tests/economic-block-time-180-economics-decentralization-recovery.mjs
      - name: Execute frozen studies
        run: |
          node sovereign-forge/node/lab/economic-block-time-180-daa-validation.mjs 256 > /tmp/fae-180s-daa-study.json
          node sovereign-forge/node/lab/economic-block-time-180-timestamp-daa-coupling.mjs 256 > /tmp/fae-180s-timestamp-study.json
          node sovereign-forge/node/lab/economic-block-time-180-mining-economics.mjs > /tmp/fae-180s-mining-economics.json
          node sovereign-forge/node/lab/economic-block-time-180-decentralization.mjs > /tmp/fae-180s-decentralization.json
          node sovereign-forge/node/lab/economic-block-time-180-outage-recovery.mjs > /tmp/fae-180s-outage-recovery.json
          node -e "for(const p of ['/tmp/fae-180s-daa-study.json','/tmp/fae-180s-timestamp-study.json','/tmp/fae-180s-mining-economics.json','/tmp/fae-180s-decentralization.json','/tmp/fae-180s-outage-recovery.json']){const r=require(p);if(r.activationAuthorized!==false||r.selectionAuthorized!==false)process.exit(1);console.log(JSON.stringify({schema:r.schema},null,2));}"
      - uses: actions/upload-artifact@v4
        with:
          name: fae-180s-validation-${{ github.sha }}
          path: |
            /tmp/fae-180s-daa-study.json
            /tmp/fae-180s-timestamp-study.json
            /tmp/fae-180s-mining-economics.json
            /tmp/fae-180s-decentralization.json
            /tmp/fae-180s-outage-recovery.json
          if-no-files-found: error
          retention-days: 30
