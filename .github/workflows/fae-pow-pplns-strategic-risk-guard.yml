name: fae-pow-pplns-strategic-risk-guard
on:
  pull_request:
    paths:
      - lab/pow-historical-assurance/pplns-strategic-risk-guard.mjs
      - lab/pow-historical-assurance/pplns-strategic-risk-guard.test.mjs
      - lab/pow-historical-assurance/pplns-bwh-economics-envelope.mjs
      - lab/pow-historical-assurance/pplns-bwh-economics-envelope.test.mjs
      - lab/pow-historical-assurance/PPLNS_STRATEGIC_HOLD_20261011.md
      - .github/workflows/fae-pow-pplns-strategic-risk-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated PPLNS activation hold and real ShareLedger withholding test
        run: node --test lab/pow-historical-assurance/pplns-strategic-risk-guard.test.mjs
      - name: Bounded economic BWH break-even envelope from authentic PPLNS share window
        run: node --test lab/pow-historical-assurance/pplns-bwh-economics-envelope.test.mjs
