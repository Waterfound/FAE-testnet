name: FAE Independent Node Recovery Atomicity (candidate)

on:
  pull_request:
    paths:
      - 'sovereign-forge/node/authoritative/node-state-recovery.mjs'
      - 'sovereign-forge/tests/independent-node-v11-hardening.mjs'
      - 'sovereign-forge/tests/independent-node-v11-process-recovery.mjs'
      - '.github/workflows/fae-node-recovery-atomicity-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-node-recovery-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-real-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and test syntax
        run: |
          node --check sovereign-forge/node/authoritative/node-state-recovery.mjs
          node --check sovereign-forge/tests/independent-node-v11-hardening.mjs
          node --check sovereign-forge/tests/independent-node-v11-process-recovery.mjs
      - name: Authentic canonical baseline RED and candidate GREEN — symlink recovery
        shell: bash
        env:
          BASE: ede1205c27c1e39d4c67a9746142a6716a38520c
        run: |
          set -euo pipefail
          target=sovereign-forge/node/authoritative/node-state-recovery.mjs
          saved="$RUNNER_TEMP/fae-node-recovery-candidate.mjs"
          cp "$target" "$saved"
          restore() { cp "$saved" "$target"; }
          trap restore EXIT
          git cat-file -e "$BASE^{commit}"
          git show "$BASE:$target" > "$target"
          set +e
          node --test --test-name-pattern='recovery must not follow predictable' \
            sovereign-forge/tests/independent-node-v11-hardening.mjs \
            > "$RUNNER_TEMP/atomic-recovery-baseline-red.log" 2>&1
          old_rc=$?
          set -e
          if [ "$old_rc" -eq 0 ]; then
            echo 'RED NOT REPRODUCED: original code unexpectedly passed'
            exit 1
          fi
          if ! grep -q 'not ok' "$RUNNER_TEMP/atomic-recovery-baseline-red.log"; then
            echo 'Baseline failed for a reason other than target test'
            cat "$RUNNER_TEMP/atomic-recovery-baseline-red.log"
            exit 1
          fi
          if ! grep -q 'recovery must never follow operator/attacker-controlled temporary symlinks' "$RUNNER_TEMP/atomic-recovery-baseline-red.log"; then
            echo 'Baseline failure is not the expected symlink overwrite counterexample'
            cat "$RUNNER_TEMP/atomic-recovery-baseline-red.log"
            exit 1
          fi
          echo 'AUTHENTIC_SOURCE_RED: baseline follows predictable recovery temp symlink'
          restore
          node --test --test-name-pattern='recovery must not follow predictable' \
            sovereign-forge/tests/independent-node-v11-hardening.mjs
          echo 'CANDIDATE_GREEN: operator sentinel untouched; restored raw state verified'
          test "$(git hash-object "$target")" = "$(git rev-parse "HEAD:$target")"
      - name: Run independent node v1.1 recovery and network adversarial suite
        run: node --test sovereign-forge/tests/independent-node-v11-hardening.mjs
      - name: Verify actual v6 SIGKILL restart, snapshot and corrupted raw recovery
        run: node --test sovereign-forge/tests/independent-node-v11-process-recovery.mjs
