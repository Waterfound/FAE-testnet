name: public-code-security-recurring-assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fae-recurring-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recurring-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify recurring-assurance policy contract
        run: node --test tests/public-code-security-recurring-assurance.mjs

      - name: Classify change and run Project Assurance when required
        run: |
          node scripts/psr19-recurring-assurance.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --out "$RUNNER_TEMP/psr19-recurring-assurance-report.json"

      - name: Preserve recurring assurance evidence
        uses: actions/upload-artifact@v7
        with:
          name: fae-public-code-recurring-assurance
          path: ${{ runner.temp }}/psr19-recurring-assurance-report.json
          if-no-files-found: error
          retention-days: 14
