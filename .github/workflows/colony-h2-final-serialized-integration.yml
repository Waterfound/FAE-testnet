name: colony-h2-final-serialized-integration

on:
  push:
    branches:
      - 'colony/h2-final-serialized-integration'
  pull_request:
    paths:
      - 'sovereign-forge/release/software-only-ceiling-freeze.json'
      - 'sovereign-forge/tests/agent-build-colony-h2-final-integration.mjs'
      - 'sovereign-forge/protocol/AGENT_BUILD_COLONY_H2_FINAL_SERIALIZED_INTEGRATION.md'
      - '.github/workflows/colony-h2-final-serialized-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2-final-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POST_COLONY_SHA: cfd08a88f0f4f2e66560811cdd7eac6f8eec9cf9
      E_MERGE_SHA: 92088ac1d60043f870b2e1eec06d7a0817325896
      F_MERGE_SHA: 20a37c26125c5a11ba4c6808c1b4e1d6a07afd88
      G2_MERGE_SHA: bd5425e6245dee558422438fad7f56ad79b6721b
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove H2 is additive-only integration evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-status "$G2_MERGE_SHA..HEAD" | tee /tmp/h2-diff.txt
          if grep -Ev '^A[[:space:]]' /tmp/h2-diff.txt | grep -q .; then
            echo 'H2 may not modify any previously verified implementation.'
            exit 1
          fi
          allowed='^A[[:space:]]+(sovereign-forge/release/software-only-ceiling-freeze\.json|sovereign-forge/tests/agent-build-colony-h2-final-integration\.mjs|sovereign-forge/protocol/AGENT_BUILD_COLONY_H2_FINAL_SERIALIZED_INTEGRATION\.md|\.github/workflows/colony-h2-final-serialized-integration\.yml)$'
          if grep -Ev "$allowed" /tmp/h2-diff.txt | grep -q .; then
            echo 'H2 touched a path outside final-integration evidence ownership.'
            exit 1
          fi

      - name: Freeze exact serialized E F G2 stage ownership
        shell: bash
        run: |
          set -euo pipefail
          check_scope() {
            local base="$1" head="$2"; shift 2
            local status actual expected
            status="$(git diff --name-status "$base..$head")"
            if printf '%s\n' "$status" | grep -Ev '^A[[:space:]]' | grep -q .; then
              echo "Non-additive serialized stage: $base..$head"
              printf '%s\n' "$status"
              exit 1
            fi
            actual="$(git diff --name-only "$base..$head" | LC_ALL=C sort)"
            expected="$(printf '%s\n' "$@" | LC_ALL=C sort)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected serialized stage scope: $base..$head"
              echo '--- actual ---'; printf '%s\n' "$actual"
              echo '--- expected ---'; printf '%s\n' "$expected"
              exit 1
            fi
          }
          check_scope "$POST_COLONY_SHA" "$E_MERGE_SHA" \
            .github/workflows/colony-e-release-reproducibility-v2.yml \
            sovereign-forge/protocol/AGENT_BUILD_COLONY_E_RELEASE_REPRODUCIBILITY_V2.md \
            sovereign-forge/release/release-candidate-config.json \
            sovereign-forge/scripts/build-reproducible-release.mjs \
            sovereign-forge/tests/release-reproducibility-colony-e-v2.mjs
          check_scope "$E_MERGE_SHA" "$F_MERGE_SHA" \
            .github/workflows/colony-f-mainnet-rehearsal-package-v2.yml \
            sovereign-forge/node/authoritative/mainnet-rehearsal-package-candidate.mjs \
            sovereign-forge/protocol/AGENT_BUILD_COLONY_F_MAINNET_REHEARSAL_PACKAGE_V2.md \
            sovereign-forge/release/mainnet-rehearsal-template.json \
            sovereign-forge/tests/mainnet-rehearsal-package-colony-f-v2.mjs
          check_scope "$F_MERGE_SHA" "$G2_MERGE_SHA" \
            .github/workflows/colony-g2-independent-release-mainnet-verifier.yml \
            sovereign-forge/protocol/AGENT_BUILD_COLONY_G2_INDEPENDENT_RELEASE_MAINNET_VERIFIER.md \
            sovereign-forge/tests/release-mainnet-independent-verifier-g2.mjs

      - name: Validate frozen software-only ceiling matrix
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('sovereign-forge/release/software-only-ceiling-freeze.json','utf8'))"
          grep -q '"status": "software-only-pre-mainnet-ceiling-reached"' sovereign-forge/release/software-only-ceiling-freeze.json
          grep -q '"software_only_work_remaining_before_external_evidence": false' sovereign-forge/release/software-only-ceiling-freeze.json
          grep -q '"external_or_physical_evidence_still_required": true' sovereign-forge/release/software-only-ceiling-freeze.json
          grep -q '"mainnet_ready_claimed": false' sovereign-forge/release/software-only-ceiling-freeze.json

      - name: Execute H2 integrated software-ceiling verdict
        shell: bash
        run: |
          set -euo pipefail
          node --check sovereign-forge/tests/agent-build-colony-h2-final-integration.mjs
          node sovereign-forge/tests/agent-build-colony-h2-final-integration.mjs | tee "$RUNNER_TEMP/h2-evidence.json"

      - name: Reproduce E v2 F v2 and G2 in serialized order
        run: |
          node sovereign-forge/tests/release-reproducibility-colony-e-v2.mjs
          node sovereign-forge/tests/mainnet-rehearsal-package-colony-f-v2.mjs
          node sovereign-forge/tests/release-mainnet-independent-verifier-g2.mjs

      - name: Reproduce activation and post-Colony evidence bank
        run: |
          node sovereign-forge/tests/activation-boundary-hardening.mjs
          node sovereign-forge/tests/activation-deep-reorg-fork.mjs
          node sovereign-forge/tests/full-activation-rehearsal.mjs
          node sovereign-forge/tests/full-target-headers-sync-rehearsal.mjs
          node sovereign-forge/tests/full-target-genesis-body-replay-regression.mjs
          node sovereign-forge/tests/activation-state-transition-core-differential.mjs
          node sovereign-forge/tests/activation-network-composition-runtime-differential.mjs
          node sovereign-forge/tests/agent-build-colony-h-integration.mjs

      - name: Freeze authority economics and unresolved production decisions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "INITIAL_SUBSIDY=10n\*COIN" sovereign-forge/node/authoritative/fae-v4-core.mjs
          grep -q "HALVING_ERA_BLOCKS=600000" sovereign-forge/node/authoritative/fae-v4-core.mjs
          grep -q "TARGET_SECONDS=180" sovereign-forge/node/authoritative/fae-v4-core.mjs
          ! grep -q "INITIAL_SUBSIDY=14" sovereign-forge/node/authoritative/fae-v4-core.mjs
          ! grep -q "TARGET_SECONDS=300" sovereign-forge/node/authoritative/fae-v4-core.mjs
          ! grep -q "HALVING_ERA_BLOCKS=430000" sovereign-forge/node/authoritative/fae-v4-core.mjs
          grep -q '"status": "not-authorized"' sovereign-forge/release/release-candidate-config.json
          grep -q '"live_activation_height": null' sovereign-forge/release/release-candidate-config.json
          grep -q '"mainnet_launch_authorized": false' sovereign-forge/release/release-candidate-config.json
          grep -q '"candidate_to_authoritative": false' sovereign-forge/release/release-candidate-config.json
          grep -q '"live_activation_height": null' sovereign-forge/release/mainnet-rehearsal-template.json
          grep -q '"bootstrap_requirements": null' sovereign-forge/release/mainnet-rehearsal-template.json
          grep -q '"bootstrap_nodes": \[\]' sovereign-forge/release/mainnet-rehearsal-template.json
          grep -q '"mainnet_launch_authorized": false' sovereign-forge/release/mainnet-rehearsal-template.json
          grep -q '"candidate_to_authoritative": false' sovereign-forge/release/mainnet-rehearsal-template.json
          grep -q '"automatic_go_path": false' sovereign-forge/release/mainnet-rehearsal-template.json
          ! grep -q '"mainnet_launch_authorized": true' sovereign-forge/release/mainnet-rehearsal-template.json
          echo 'COLONY_H2_AUTHORITY=UNCHANGED'

      - name: Preserve final software-ceiling evidence
        uses: actions/upload-artifact@v4
        with:
          name: fae-colony-h2-final-software-ceiling-evidence
          path: ${{ runner.temp }}/h2-evidence.json
          if-no-files-found: error
          retention-days: 14
