name: pq12-build-colony-plan

on:
  pull_request:
    paths:
      - 'lab/post-quantum-signatures/pq12/**'
      - '.github/workflows/pq12-build-colony-plan.yml'
  push:
    branches:
      - 'colony/pq12-light-browser-plan'
    paths:
      - 'lab/post-quantum-signatures/pq12/**'
      - '.github/workflows/pq12-build-colony-plan.yml'

permissions:
  contents: read

jobs:
  work-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Build Colony
        run: python -m pip install "git+https://github.com/Waterfound/Build-Colony.git@17979869a85c9f5adf2cef2ceb589a07fcef6239"
      - name: Execute AGDWS work selection
        run: python lab/post-quantum-signatures/pq12/build-colony-select.py
      - name: Upload decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: pq12-build-colony-selection
          path: lab/post-quantum-signatures/pq12/build-colony-selection-output.json
          if-no-files-found: error
