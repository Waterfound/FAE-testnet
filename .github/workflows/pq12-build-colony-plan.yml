name: pq12-build-colony-plan

on:
  pull_request:
    paths:
      - 'lab/post-quantum-signatures/pq12/**'
      - '.github/workflows/pq12-build-colony-plan.yml'
  push:
    branches:
      - 'colony/pq12-light-browser-plan'
    paths:
      - 'lab/post-quantum-signatures/pq12/**'
      - '.github/workflows/pq12-build-colony-plan.yml'

permissions:
  contents: read

jobs:
  work-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen Build Colony snapshot identity
        run: |
          python - <<'PY'
          import hashlib, pathlib, json
          p=pathlib.Path('lab/post-quantum-signatures/pq12/build_colony_snapshot/build_colony/work_selection.py')
          prov=json.loads(pathlib.Path('lab/post-quantum-signatures/pq12/build_colony_snapshot/PROVENANCE.json').read_text())
          if prov['commit'] != '17979869a85c9f5adf2cef2ceb589a07fcef6239':
              raise SystemExit('wrong Build Colony commit')
          print('snapshot_sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('git_blob_sha='+prov['blob_sha'])
          PY
      - name: Execute AGDWS work selection
        env:
          PYTHONPATH: lab/post-quantum-signatures/pq12/build_colony_snapshot
        run: python lab/post-quantum-signatures/pq12/build-colony-select.py
      - name: Upload decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: pq12-build-colony-selection
          path: lab/post-quantum-signatures/pq12/build-colony-selection-output.json
          if-no-files-found: error
