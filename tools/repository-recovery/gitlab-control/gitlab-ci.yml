stages:
  - backup

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"

repository_mirror:
  stage: backup
  image: alpine:3.22
  resource_group: fae-repository-mirror
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache bash coreutils diffutils git openssh-client
  script:
    - bash control/run-mirror.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - mirror-manifest.txt
